<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Translator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Code Translator</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-icon" id="themeToggle" title="Toggle Theme">🌙</button>
                <a href="https://github.com/code-translator" class="btn btn-icon" title="GitHub">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                </a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Source Panel -->
            <div class="editor-panel source-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="panel-icon">📝</span>
                        <span>Source Code</span>
                    </div>
                    <div class="language-selector">
                        <label>Language:</label>
                        <select id="sourceLanguage">
                            <option value="auto">🔍 Auto Detect</option>
                            <option value="python">🐍 Python</option>
                            <option value="cpp">⚙️ C++</option>
                            <option value="java">☕ Java</option>
                            <option value="javascript">🟨 JavaScript</option>
                            <option value="c">🔧 C</option>
                        </select>
                    </div>
                </div>
                <div class="editor-container">
                    <div class="line-numbers" id="sourceLineNumbers">1</div>
                    <textarea id="sourceCode" placeholder="// Paste or write your code here...

def hello():
    print('Hello World!')

hello()" spellcheck="false"></textarea>
                </div>
                <div class="panel-footer">
                    <span class="status" id="sourceStatus">Ready</span>
                    <span class="char-count" id="sourceCharCount">0 chars</span>
                </div>
            </div>

            <!-- Convert Button Area -->
            <div class="convert-area">
                <div class="convert-controls">
                    <select id="targetLanguage" class="target-select">
                        <option value="python">🐍 Python</option>
                        <option value="cpp">⚙️ C++</option>
                        <option value="java">☕ Java</option>
                        <option value="javascript">🟨 JavaScript</option>
                        <option value="c">🔧 C</option>
                    </select>
                    <button class="btn btn-convert" id="convertBtn">
                        <span class="btn-text">Convert</span>
                        <span class="btn-icon">→</span>
                    </button>
                </div>
                <div class="quick-actions">
                    <button class="btn btn-small" id="swapBtn" title="Swap Languages">🔄 Swap</button>
                    <button class="btn btn-small" id="clearBtn" title="Clear All">🗑️ Clear</button>
                    <button class="btn btn-small" id="sampleBtn" title="Load Sample">📋 Sample</button>
                </div>
            </div>

            <!-- Output Panel -->
            <div class="editor-panel output-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="panel-icon">✨</span>
                        <span>Converted Code</span>
                    </div>
                    <div class="panel-actions">
                        <button class="btn btn-small" id="copyBtn" title="Copy to Clipboard">📋 Copy</button>
                        <button class="btn btn-small" id="downloadBtn" title="Download File">💾 Download</button>
                    </div>
                </div>
                <div class="editor-container">
                    <div class="line-numbers" id="outputLineNumbers">1</div>
                    <textarea id="outputCode" placeholder="// Converted code will appear here..." readonly spellcheck="false"></textarea>
                </div>
                <div class="panel-footer">
                    <span class="status" id="outputStatus">Waiting for conversion...</span>
                    <span class="char-count" id="outputCharCount">0 chars</span>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-left">
                <span>Code Translator v1.0</span>
                <span class="separator">|</span>
                <span>Supports: Python, C, C++, Java, JavaScript</span>
            </div>
            <div class="footer-right">
                <span id="detectedLang">Auto-detect: Ready</span>
            </div>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span class="toast-message" id="toastMessage">Success!</span>
    </div>

    <script src="converters.js"></script>
    <script src="app.js"></script>
</body>
</html>
